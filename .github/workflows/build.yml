name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Android64
          sdk: stable
      - uses: actions/upload-artifact@v4
        with:
          name: gdsa-android64
          path: ${{ steps.build.outputs.build-output }}
